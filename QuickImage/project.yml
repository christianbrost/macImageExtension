name: QuickImage
options:
  bundleIdPrefix: dev.christianbrost.quickimage
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  QuickImage:
    type: application
    platform: macOS
    sources:
      - path: QuickImage
    info:
      path: QuickImage/Info.plist
      properties:
        CFBundleDisplayName: QuickImage
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.christianbrost.quickimage
        PRODUCT_NAME: QuickImage
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: QuickImage/QuickImage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - target: ConvertToPNG
        embed: true

  ConvertToPNG:
    type: app-extension
    platform: macOS
    sources:
      - path: ConvertToPNG
    info:
      path: ConvertToPNG/Info.plist
      properties:
        CFBundleDisplayName: In PNG konvertieren
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionRequestHandler
          NSExtensionAttributes:
            NSExtensionServiceAllowsFinderPreviewItem: true
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.christianbrost.quickimage.ConvertToPNG
        PRODUCT_NAME: ConvertToPNG
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
    entitlements:
      path: ConvertToPNG/ConvertToPNG.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
