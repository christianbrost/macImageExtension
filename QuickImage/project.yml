name: QuickImage
options:
  bundleIdPrefix: dev.christianbrost.quickimage
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6WW3PDXBU9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_DEBUG_DYLIB: NO

targets:
  QuickImage:
    type: application
    platform: macOS
    sources:
      - path: QuickImage
    info:
      path: QuickImage/Info.plist
      properties:
        CFBundleDisplayName: QuickImage
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSServices:
          - NSMenuItem:
              default: "In PNG konvertieren"
            NSMessage: convertToPNG
            NSPortName: QuickImage
            NSSendTypes:
              - NSFilenamesPboardType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.christianbrost.quickimage
        PRODUCT_NAME: QuickImage
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # No App Sandbox: this is a personal-use tool (no App Store, no notarization,
    # see SPEC.md). Sandboxing only grants read/write to the exact file the user
    # selected, not to sibling files in the same folder — which breaks writing the
    # converted output next to the original. Full disk access is fine for this use case.
    entitlements:
      path: QuickImage/QuickImage.entitlements
      properties:
        com.apple.security.app-sandbox: false
