name: QuickImage
options:
  bundleIdPrefix: dev.christianbrost.quickimage
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  QuickImage:
    type: application
    platform: macOS
    sources:
      - path: QuickImage
    info:
      path: QuickImage/Info.plist
      properties:
        CFBundleDisplayName: QuickImage
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.christianbrost.quickimage
        PRODUCT_NAME: QuickImage
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: QuickImage/QuickImage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
